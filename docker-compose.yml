services:
  redis:
    image: redis:7-alpine
    container_name: softbox-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: softbox-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: softbox
      MINIO_ROOT_PASSWORD: softboxminio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  redis-data:
  minio-data:
