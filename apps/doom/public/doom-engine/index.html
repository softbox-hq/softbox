<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doom Engine Frame</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #f1d4b8;
        font-family: monospace;
      }

      body {
        display: grid;
        place-items: center;
      }

      #viewport {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #000;
      }

      #status {
        position: absolute;
        left: 16px;
        bottom: 16px;
        padding: 8px 10px;
        background: rgba(0, 0, 0, 0.7);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <div id="viewport">
      <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
      <div id="status">Waiting for WAD</div>
    </div>
    <script src="./bootstrap.js"></script>
  </body>
</html>
